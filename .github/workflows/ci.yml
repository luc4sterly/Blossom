name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev libgl-dev libgmp-dev libboost-dev \
            libvulkan-dev mesa-vulkan-drivers

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Synthetic NAND tool tests
        run: |
          python3 -m venv /tmp/mknand-venv
          /tmp/mknand-venv/bin/pip install -q -r tools/mknand/requirements.txt
          /tmp/mknand-venv/bin/python -m unittest discover -s tools/mknand -v

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: blossom-linux-x86_64
          path: build/src/blossom_qt/blossom
